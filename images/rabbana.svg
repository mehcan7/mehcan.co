<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Rabbana">
  <rect width="1600" height="1000" fill="#12211a"/>

  <rect x="620" y="360" width="200" height="200" rx="52" fill="#1b3226"/>

  <!-- maantje: cirkel met een tweede cirkel eruit geknipt -->
  <mask id="maan">
    <rect x="620" y="360" width="200" height="200" fill="#000"/>
    <circle cx="716" cy="462" r="56" fill="#fff"/>
    <circle cx="752" cy="440" r="50" fill="#000"/>
  </mask>
  <rect x="620" y="360" width="200" height="200" fill="#efc050" mask="url(#maan)"/>
  <circle cx="762" cy="424" r="6" fill="#efc050"/>

  <text x="720" y="626"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="40" font-weight="600" fill="#e9f1ea" text-anchor="middle">Rabbana</text>
</svg>
